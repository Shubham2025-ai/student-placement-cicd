name: Student Placement Prediction CI-CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test-and-validate:
    name: CI - Validate, Test, Train, Evaluate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      # Fails the pipeline if code quality check fails
      - name: Code Quality Check (flake8)
        run: |
          python -m flake8 .

      # Fails the pipeline if missing/invalid data is detected
      - name: Validate Data
        run: |
          python -m src.data_validation

      # Fails the pipeline if unit tests fail
      - name: Run Unit Tests
        run: |
          python -m pytest tests/ -v

      # Fails the pipeline if the model file is not generated
      - name: Train Model
        run: |
          python -m src.train
          test -f models/model.pkl || (echo "model.pkl was not generated" && exit 1)

      # Fails the pipeline if accuracy < 80%
      - name: Evaluate Model Accuracy
        run: |
          python -m src.evaluate

      # Fails the pipeline if the prediction API fails
      - name: Test Prediction API
        run: |
          python scripts/check_api.py

      - name: Upload Trained Model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/model.pkl

  deploy:
    name: CD - Deploy Application
    needs: build-test-and-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Trained Model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Deploy Application
        run: |
          echo "All quality gates passed (lint, data validation, unit tests,"
          echo "model file present, accuracy >= 80%, API responding)."
          echo "Deploying Student Placement Prediction API..."
          echo "Application deployed successfully!"
